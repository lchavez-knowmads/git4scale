version: 2

models:
  - name: stg_weather
    description: "Staged weather data cleaned and standardized"
    columns:
      - name: city
        tests:
          - not_null
      - name: temperature
        tests:
          - not_null

  - name: stg_air_quality
    description: "Staged air quality data cleaned and standardized"
    columns:
      - name: city
        tests:
          - not_null
      - name: aqi
        tests:
          - not_null

  - name: mart_weather_air_quality
    description: "Mart table combining weather and air quality data"
    columns:
      - name: city
        tests:
          - not_null
      - name: weather_temperature
        tests:
          - not_null